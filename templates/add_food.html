<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Add Food | NutriTrack</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<link rel="stylesheet"
href="{{ url_for('static', filename='css/style.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/chatbot.css') }}">

</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-success shadow">

<div class="container">

<a class="navbar-brand fw-bold fs-3" href="/dashboard">

🍏 NutriTrack

</a>

<a href="/dashboard" class="btn btn-light">

<i class="fa-solid fa-arrow-left"></i>

Dashboard

</a>

</div>

</nav>

<div class="container py-5">

<div class="row justify-content-center">

<div class="col-lg-7">

<div class="card shadow-lg border-0 rounded-4">

<div class="card-header bg-success text-white text-center py-3">

<h2>

<i class="fa-solid fa-utensils"></i>

Add Food

</h2>

</div>

<div class="card-body p-4">

<form method="POST">

<div class="mb-3">

<label class="form-label fw-bold">

Meal Type

</label>

<select
name="meal_type"
class="form-select form-select-lg"
required>

<option value="">Select Meal</option>

<option>Breakfast</option>

<option>Lunch</option>

<option>Dinner</option>

<option>Snack</option>

</select>

</div>

<div class="mb-3">

<label class="form-label fw-bold">

Food Name

</label>

<input
type="text"
name="food_name"
class="form-control form-control-lg"
placeholder="Example: Rice, Egg, Chicken"
required>

<div class="form-text">

Supported foods:
Egg, Rice, Chicken, Fish, Apple, Banana, Oats, Milk, Paneer, Soya Chunks...

</div>

</div>

<div class="mb-4">

<label class="form-label fw-bold">

Quantity (grams)

</label>

<input
type="number"
name="quantity"
class="form-control form-control-lg"
placeholder="Example: 100"
min="1"
required>

</div>

<div class="d-grid gap-2">

<button
type="submit"
class="btn btn-success btn-lg">

<i class="fa-solid fa-plus"></i>

Add Food

</button>

<a href="/dashboard"
class="btn btn-outline-secondary btn-lg">

Cancel

</a>

</div>

</form>

</div>

</div>

<div class="alert alert-info mt-4">

<h5>

💡 Tip

</h5>

<p class="mb-0">

Enter the food name exactly as it exists in the
<code>nutrition_data</code> dictionary.
For example:
<strong>egg</strong>,
<strong>rice</strong>,
<strong>banana</strong>,
<strong>paneer</strong>,
<strong>milk</strong>.

</p>

</div>

</div>

</div>

</div>
{% include 'chatbot.html' %}
</body>

</html>
