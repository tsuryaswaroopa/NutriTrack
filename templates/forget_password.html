<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password | NutriTrack</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

</head>


<body class="auth-page">

<div class="auth-container">

    <div class="auth-card">

        <div class="text-center mb-4">

            <h1 class="brand-title">
                Nutri<span>Track</span>
            </h1>

            <h3 class="reset-title">
                Reset Password
            </h3>

            <p class="auth-subtitle">
                Create a new password to access your account.
            </p>

        </div>


        {% if error %}

        <div class="alert alert-danger">
            {{ error }}
        </div>

        {% endif %}


        {% if success %}

        <div class="alert alert-success">
            {{ success }}
        </div>

        <div class="text-center mt-3">

            <a href="/login" class="auth-btn d-block text-decoration-none">
                Back to Login
            </a>

        </div>

        {% else %}


        <form method="POST">

            <div class="mb-3">

                <label class="form-label">
                    Email Address
                </label>

                <input
                    type="email"
                    name="email"
                    class="form-control"
                    placeholder="Enter your registered email"
                    value="{{ email or '' }}"
                    required
                >

            </div>


            <div class="mb-3">

                <label class="form-label">
                    New Password
                </label>

                <div class="password-wrapper">

                    <input
                        type="password"
                        name="new_password"
                        id="newPassword"
                        class="form-control"
                        placeholder="Enter new password"
                        required
                    >

                    <button
                        type="button"
                        class="password-toggle"
                        onclick="togglePassword('newPassword', 'newEye')"
                    >
                        <span id="newEye">👁</span>
                    </button>

                </div>

            </div>


            <div class="mb-4">

                <label class="form-label">
                    Confirm New Password
                </label>

                <div class="password-wrapper">

                    <input
                        type="password"
                        name="confirm_password"
                        id="confirmNewPassword"
                        class="form-control"
                        placeholder="Confirm new password"
                        required
                    >

                    <button
                        type="button"
                        class="password-toggle"
                        onclick="togglePassword('confirmNewPassword', 'confirmEye')"
                    >
                        <span id="confirmEye">👁</span>
                    </button>

                </div>

            </div>


            <button type="submit" class="auth-btn">
                Reset Password
            </button>

        </form>


        <div class="auth-footer">

            <a href="/login">
                ← Back to Login
            </a>

        </div>

        {% endif %}

    </div>

</div>


<script>

function togglePassword(inputId, eyeId) {

    const input = document.getElementById(inputId);
    const eye = document.getElementById(eyeId);

    if (input.type === "password") {

        input.type = "text";
        eye.textContent = "🙈";

    } else {

        input.type = "password";
        eye.textContent = "👁";

    }

}

</script>

</body>
</html>
