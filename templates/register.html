<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Register - NutriTrack Pro</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<link rel="stylesheet"
href="{{ url_for('static', filename='css/style.css') }}">

</head>
<body class="login-bg">

<video autoplay muted loop playsinline class="background-video">
    <source src="{{ url_for('static', filename='videos/nutrition-bg.mp4') }}" type="video/mp4">
</video>

<div class="container">


<div class="row justify-content-center align-items-center vh-100">

<div class="col-md-6">

<div class="card shadow-lg border-0 rounded-4 p-4">

<div class="text-center mb-4">

<h1 class="text-success fw-bold">
🍏 NutriTrack
</h1>

<p class="text-muted">
Create your account and start tracking your nutrition
</p>

</div>

<form method="POST" onsubmit="return validateForm()">

<div class="mb-3">

<label class="form-label fw-semibold">
<i class="fa-solid fa-user"></i>
Full Name
</label>

<input
type="text"
name="fullname"
class="form-control form-control-lg"
placeholder="Enter your full name"
required>

</div>

<div class="mb-3">

<label class="form-label fw-semibold">
<i class="fa-solid fa-envelope"></i>
Email
</label>

<input
type="email"
name="email"
class="form-control form-control-lg"
placeholder="Enter your email"
required>

</div>

<div class="mb-3">

<label class="form-label fw-semibold">
<i class="fa-solid fa-lock"></i>
Password
</label>

<input
type="password"
id="password"
name="password"
class="form-control form-control-lg"
placeholder="Create password"
required>

<div class="form-text">
Password should contain at least 6 characters.
</div>

</div>

<div class="mb-3">

<label class="form-label fw-semibold">
<i class="fa-solid fa-lock"></i>
Confirm Password
</label>

<input
type="password"
id="confirmPassword"
class="form-control form-control-lg"
placeholder="Confirm password"
required>

</div>

<div id="error" class="text-danger mb-3"></div>

<button class="btn btn-success btn-lg w-100">

<i class="fa-solid fa-user-plus"></i>

Create Account

</button>

</form>

<hr>

<div class="text-center">

Already have an account?

<a href="/login">

Login

</a>

</div>

<div class="text-center mt-3">

<a href="/">

← Back to Home

</a>

</div>

</div>

</div>

</div>

</div>

<script>

function validateForm(){

let password=document.getElementById("password").value;

let confirm=document.getElementById("confirmPassword").value;

let error=document.getElementById("error");

if(password.length<6){

error.innerHTML="Password must contain at least 6 characters.";

return false;

}

if(password!==confirm){

error.innerHTML="Passwords do not match.";

return false;

}

return true;

}

</script>

</body>
</html>
